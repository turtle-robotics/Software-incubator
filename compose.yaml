services:
  ros:
    build:
      context: .
      dockerfile: Dockerfile
    image: turtle-si-ros2:latest
    working_dir: /home/ros/ros2_ws
    volumes:
      - ./ros2_ws:/home/ros/ros2_ws:rw
      - colcon-build:/home/ros/ros2_ws/build
      - colcon-install:/home/ros/ros2_ws/install
      - colcon-log:/home/ros/ros2_ws/log
      - ros-home:/home/ros
    stdin_open: true
    tty: true
    command: bash
    environment:
      GZ_PARTITION: turtle_si
      ROS_DOMAIN_ID: 0

volumes:
  colcon-build:
  colcon-install:
  colcon-log:
  ros-home:
